# Conda environment used to render the Week 3 and Week 4 notebooks (Linux, November 2026).
#   micromamba create -f environment.yml   (or: conda env create -f environment.yml)
#   micromamba activate xenium-training
# Full session details: session_info.txt
name: xenium-training
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.4.3
  - r-seurat=5.5.1
  - r-seuratobject=5.4.0
  - r-tidyverse=2.0.0
  - r-ggplot2=4.0.3
  - r-patchwork=1.3.2
  - r-future=1.82.0
  - r-arrow=25.0.1        # reads Xenium .parquet files
  - r-hdf5r=1.3.16        # reads cell_feature_matrix.h5
  - r-sf=1.1.3
  - r-rmarkdown=2.32
  - r-knitr=1.52
  - r-formatr=1.14
  - bioconductor-glmgampoi=1.18.0  # faster SCTransform
  - pandoc
